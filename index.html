<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senderkataster Modder Browser Redirect</title>
    
    <script>
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function detectBrowserEngine() {
          console.log(navigator.userAgentData);
          await delay(30000);
          if (navigator.userAgentData && Array.isArray(navigator.userAgentData.brands)) {
            const brands = navigator.userAgentData.brands.map(brandInfo => brandInfo.brand);
            if (brands.some(brand => /Edge|Edg/i.test(brand))) return "Edge";
            if (brands.some(brand => /Chrome|Chromium/i.test(brand))) return "Chrome";
          }

          const ua = navigator.userAgent || "";
          if (/Edg(e)?\//i.test(ua)) return "Edge";
          if (/Chrome|Chromium/i.test(ua)) return "Chrome";
          if (/Firefox/i.test(ua)) return "Firefox";

          return "Other";
        }

        async function redirectBasedOnBrowser() {
          const browser = await detectBrowserEngine();

          if (browser === "Edge") {
            window.location.replace("https://microsoftedge.microsoft.com/addons/detail/senderkataster-modder-by-/hnihgakaekppnibkojlampnopkfgignh");
          } else if (browser === "Chrome") {
            window.location.replace("https://chromewebstore.google.com/detail/bjbcfpbcpfflgkcnbcckondiipanmfjk");
          } else if (browser === "Firefox") {
            window.location.replace("https://addons.mozilla.org/de/firefox/addon/senderkataster-modder/");
          } else {
            window.location.replace("https://github.com/NerdTech-one/Senderkataster-Modder");
          }
        }
        
        redirectBasedOnBrowser();
    </script>
</head>
<body>
    <p>Redirecting you to the optimized version of the site based on your browser...</p>

    <noscript>
        <p>JavaScript is required for automatic redirection. Please choose a version manually:</p>
        <ul>
            <li><a href="https://microsoftedge.microsoft.com/addons/detail/senderkataster-modder-by-/hnihgakaekppnibkojlampnopkfgignh">Microsoft Edge Version</a></li>
            <li><a href="https://chromewebstore.google.com/detail/bjbcfpbcpfflgkcnbcckondiipanmfjk">Chromium Version (Chrome, Brave, Opera)</a></li>
            <li><a href="https://addons.mozilla.org/de/firefox/addon/senderkataster-modder/">Firefox Version</a></li>
            <li><a href="https://github.com/NerdTech-one/Senderkataster-Modder">GitHub</a></li>
        </ul>
    </noscript>
</body>
</html>
